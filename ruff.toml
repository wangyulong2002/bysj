# Ruff 配置（P0-6：项目此前无任何 lint 工具）
#
# 策略（对齐审核报告"先只挡明显错误，逐步收紧"）：
#   当前只启用 E9（语法错误/致命）+ F（pyflakes：未定义名、重复定义等），
#   先让 CI 能挡住真正会崩的问题；E/W/C 风格类规则与 F401（未使用导入）
#   待存量清理后再逐步开启（审核报告 P2-3）。
target-version = "py312"
line-length = 120

[lint]
select = ["E9", "F"]
ignore = [
    "F401",  # 未使用导入：存量较多，暂不阻塞 CI
    "F841",  # 未使用局部变量：同上
]

[lint.per-file-ignores]
# 测试里大量 fixture 参数属于"声明即使用"，且允许较宽松写法
"server/tests/**" = ["F401", "F811", "F841"]
