# =============================================================
# bysj —— Nginx 本地开发配置（仅 HTTP，无证书）
#
# 用途：本地/演示环境（没有域名与 Let's Encrypt 证书）使用。
# 生产必须使用同目录的 bysj.conf（全站 HTTPS + HSTS + 安全响应头，P1-2）。
#
# 用法：
#   sudo cp bysj/scripts/nginx/bysj-dev.conf /etc/nginx/conf.d/bysj.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    server_name _;

    root /var/www/bysj-h5;
    index index.html;

    # C-05：须大于应用层 10MB 限制
    client_max_body_size 12m;

    location /static/ {
        try_files $uri $uri/ @django;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RAG 流式问答（SSE）：关闭缓冲
    location /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @django {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
