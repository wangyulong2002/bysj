# =============================================================
# bysj 智慧校园信息管理系统 —— Nginx 部署配置
#
# 用法（需 sudo）：
#   sudo mkdir -p /var/www/bysj-h5
#   sudo cp -r bysj/uniapp/dist/dev/h5/* /var/www/bysj-h5/
#   sudo cp bysj/scripts/nginx/bysj.conf /etc/nginx/conf.d/bysj.conf
#   sudo rm -f /etc/nginx/sites-enabled/default   # 避免 80 端口 default_server 冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# 架构（设计报告 9.4）：
#   /            H5 静态产物（uni-app 构建产物 dist/dev/h5）
#   /api/**      → FastAPI :8000（应用端接口，含 SSE 流式问答）
#   /admin/**    → Django :8001（管理端自建 SPA + /admin/api/**）
#   /static/**   优先命中 H5 静态文件，未命中回源 Django（管理前端 /static/assets/*）
# =============================================================

server {
    listen 80;
    server_name _;

    root /var/www/bysj-h5;
    index index.html;

    # C-05：须大于应用层 10MB 限制，否则 413 先于业务校验触发
    client_max_body_size 12m;

    # ---- 静态资源 ----
    # H5 产物走磁盘；Django 管理前端的 /static/assets/* 回源 Django
    location /static/ {
        try_files $uri $uri/ @django;
        expires 30d;
    }

    # ---- FastAPI 应用端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- RAG 流式问答（SSE，8.5）：必须关闭缓冲，否则流式不实时 ----
    location /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ---- Django 管理端（/admin/ 自建 SPA + /admin/api/**）----
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源回源（管理前端构建产物）
    location @django {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- H5 路由兜底（hash 路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
