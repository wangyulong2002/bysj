# =============================================================
# bysj 智慧校园信息管理系统 —— Nginx 生产配置（P1-2：全站 HTTPS）
#
# 审核报告 P1-2：原配置只有 `listen 80`，没有 443、没有证书、没有 HSTS、
# 没有 HTTP→HTTPS 跳转 —— 登录密码、JWT、成绩、个人信息全部明文过网（校园
# WiFi 即可嗅探），在等保/PIPL 语境下是一票否决项。
#
# 本配置实现：
#   1. 80 → 443 强制跳转（保留 ACME 校验路径，便于 certbot 续签）
#   2. 443 + TLS1.2/1.3 + certbot 证书
#   3. HSTS（含子域、preload）+ 安全响应头（nosniff / DENY / Referrer-Policy / CSP 基础位）
#   4. 登录接口 limit_req 限流（与应用层 B-13 限流形成双层防护）
#
# 前置步骤（sudo 执行）：
#   # 1) 申请证书（把 example.com 换成真实域名；需域名已解析到本机）
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d example.com
#
#   # 2) 替换下方 ssl_certificate 路径中的 example.com
#   # 3) 部署 H5 与配置
#   sudo mkdir -p /var/www/bysj-h5
#   sudo cp -r bysj/uniapp/dist/dev/h5/* /var/www/bysj-h5/
#   sudo cp bysj/scripts/nginx/bysj.conf /etc/nginx/conf.d/bysj.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 本地开发（无证书、仅 HTTP）请使用：scripts/nginx/bysj-dev.conf
#
# 架构（设计报告 9.4）：
#   /            H5 静态产物（uni-app dist/dev/h5）
#   /api/**      → FastAPI :8000（应用端接口，含 SSE 流式问答）
#   /admin/**    → Django :8001（管理端自建 SPA + /admin/api/**）
#   /static/**   优先命中 H5 静态文件，未命中回源 Django
# =============================================================

# ---- 登录限流区（P1-2：与应用层限流双层防护）----
limit_req_zone $binary_remote_addr zone=bysj_login:10m rate=10r/m;
limit_req_status 429;

# ---- HTTP：全部跳转 HTTPS ----
server {
    listen 80;
    server_name _;

    # ACME http-01 校验（certbot 续签必须走 80，不能跳转）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ↓↓↓ 把 example.com 替换为真实域名（certbot 生成路径）↓↓↓
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # TLS 基线：仅 1.2/1.3，现代 cipher，会话缓存
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（P1-2）：一年 + 含子域 + preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 安全响应头（P1-2）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP：默认同源；H5/管理端如需 CDN 再按需放开 script-src/style-src
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    root /var/www/bysj-h5;
    index index.html;

    # C-05：须大于应用层 10MB 限制，否则 413 先于业务校验触发
    client_max_body_size 12m;

    # ---- 登录接口限流（P1-2）----
    # 应用端登录（FastAPI）与管理端登录（Django）各自限流
    location = /api/auth/login {
        limit_req zone=bysj_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/api/auth/login {
        limit_req zone=bysj_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 静态资源 ----
    # H5 产物走磁盘；Django 管理前端的 /static/assets/* 回源 Django
    location /static/ {
        try_files $uri $uri/ @django;
        expires 30d;
    }

    # ---- FastAPI 应用端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- RAG 流式问答（SSE，8.5）：必须关闭缓冲，否则流式不实时 ----
    location /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ---- Django 管理端（/admin/ 自建 SPA + /admin/api/**）----
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源回源（管理前端构建产物）
    location @django {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- H5 路由兜底（hash 路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
