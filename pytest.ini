# pytest 配置（P0-6：此前无任何测试配置，无法 CI 化）
#
# 运行：  pytest                    # 在 bysj/ 根目录执行，自动发现 server/tests
#        pytest server/tests -q
#        pytest -m "not rag"       # 跳过依赖上游模型的 RAG 用例
#
# 环境：测试强制使用独立库 campus_test（P0-5，见 server/tests/conftest.py），
#       依赖 MySQL(3307) 与 Redis(6379)。CI 中由 services 提供。
[pytest]
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --durations=10
markers =
    unit: 纯逻辑单元测试（无外部依赖）
    integration: 集成测试（依赖 MySQL / Redis）
    rag: RAG 相关测试（依赖 Redis 向量索引与上游 LLM/Embedding）
filterwarnings =
    default
